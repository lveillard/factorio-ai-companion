name: Check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run format:check
      - run: bun run build
      - run: bun run codex:smoke
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:web
      - run: bun run mod:package
      - run: docker build -t factorio-ai-companion:check .
      - run: docker tag factorio-ai-companion:check factorio-ai-companion:$(bun -p 'require("./package.json").version')
      - run: bun run test:docker
      - uses: actions/upload-artifact@v4
        with:
          name: companion-mod
          path: dist/*.zip
